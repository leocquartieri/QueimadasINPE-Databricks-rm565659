name: provision-mysql-queimadas

on:
  workflow_dispatch:

env:
  TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
  # Troque pelo seu RM (somente minúsculas e números; a storage account precisa ser única no mundo)
  RM: "rm000000"
  TFSTATE_RG: rg-tfstate
  TFSTATE_LOCATION: brazilsouth

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bootstrap do backend (state do Terraform)
        run: |
          SA="sttfstate${RM}"
          az group create -n "$TFSTATE_RG" -l "$TFSTATE_LOCATION" -o none
          az storage account create -n "$SA" -g "$TFSTATE_RG" -l "$TFSTATE_LOCATION" \
            --sku Standard_LRS --allow-blob-public-access false -o none
          az storage container create --name tfstate --account-name "$SA" --auth-mode login -o none || true
          echo "TFSTATE_SA=$SA" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RG" \
            -backend-config="storage_account_name=$TFSTATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=queimadas-${RM}.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Mostrar outputs (evidência)
        run: |
          echo "RM=$RM"
          terraform output
